# XcodeGen spec — generate `TheFinalThird.xcodeproj` with `xcodegen generate`.
name: TheFinalThird
options:
  bundleIdPrefix: com.thefinalthird
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_SWIFT_FLAGS: "-warnings-as-errors"
    DEVELOPMENT_TEAM: RB657RW2UW
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    exactVersion: 2.27.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.4.0
  Collections:
    url: https://github.com/apple/swift-collections
    from: 1.1.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

targets:
  TheFinalThird:
    type: application
    platform: iOS
    sources:
      - path: TheFinalThird
    resources:
      - path: TheFinalThird/Resources
    info:
      path: TheFinalThird/App/Info.plist
      properties:
        CFBundleDisplayName: The Final Third
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Voice rooms let you talk with your circle. Mic is only used when you press to talk."
        NSCameraUsageDescription: "Optional avatar capture."
        NSUserTrackingUsageDescription: "We do not track you across apps."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - voip
          - fetch
          - remote-notification
        # Build-time substitution from Config/Base.xcconfig (which #includes Secrets.xcconfig).
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        LIVEKIT_URL: $(LIVEKIT_URL)
        REVENUECAT_API_KEY_IOS: $(REVENUECAT_API_KEY_IOS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thefinalthird.app
        DEVELOPMENT_ASSET_PATHS: ""
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        CODE_SIGN_ENTITLEMENTS: TheFinalThird/App/TheFinalThird.entitlements
    dependencies:
      - package: Supabase
      - package: RevenueCat
      - package: LiveKit
      - package: Lottie
      - package: Collections

  TheFinalThirdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TheFinalThirdTests
    dependencies:
      - target: TheFinalThird
      - package: SnapshotTesting
